services:
  - type: web
    name: clouddash-support-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/seed_kb.py
    startCommand: PYTHONPATH=. uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
